<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Kontakt – Just Yoga Boskovice</title>
  <meta name="description" content="Kontakt na Just Yoga a pohybové studio Boskovice – adresa Bílkova 91, telefon 723 466 926, e-mail info@justyoga.cz a kontaktní formulář." />
  <meta property="og:site_name" content="Just Yoga a pohybové studio Boskovice" />
  <link rel="icon" href="assets/images/favicon-32.png" sizes="32x32" type="image/png" />
  <link rel="icon" href="assets/images/favicon-512.png" sizes="512x512" type="image/png" />
  <link rel="apple-touch-icon" href="assets/images/apple-touch-icon.png" />
  <!-- Raleway 300 nese H1, tedy LCP text stránky. Bez preloadu ho prohlížeč
       objeví až po vyhodnocení CSS (měřeno: start ~49 ms). Dva soubory, ne
       jeden: české nadpisy potřebují latin i latin-ext subset. crossorigin
       je povinné i pro same-origin fonty — bez něj se preload zahodí
       a soubor se stáhne dvakrát. -->
  <link rel="preload" href="assets/fonts/raleway-latin-300-normal.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="assets/fonts/raleway-latin-ext-300-normal.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="css/fonts.css" />
  <link rel="stylesheet" href="css/tokens.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <script type="module" src="js/main.js"></script>
  <script type="module" src="js/seo.js"></script>
  <script type="module" src="js/pages/kontakt.js"></script>
</head>
<body>
  <site-header></site-header>

  <main id="main" tabindex="-1" class="page-shell section">
    <h1 class="page-heading">Kontakt</h1>

    <!-- Dvě místa, ne jedno. Jóga je ve studiu na Bílkově, jumping
         a kondiční lekce v posilovně u ZŠ Slovákova — dokud tady byla jen
         jedna adresa, mohl zákazník dojet na jumping na špatné místo.
         Karty se odvozují z aktivit, takže se seznam nikde neduplikuje.
         Mapa se nevkládá iframem: klasický output=embed se v ověřovacím
         setupu projektu nevykresluje spolehlivě a Static Maps API by
         znamenalo klíč ve veřejném repu a první požadavek na třetí stranu
         na celém webu. Odkaz vede rovnou na navigaci. -->
    <section class="section">
      <h2 class="section-heading">Kde cvičíme</h2>
      <studio-venues data-studio-venues></studio-venues>
    </section>

    <div class="contact-grid">
      <section class="card contact-card">
        <p class="contact-name">Lenka Nahodilová</p>
        <ul class="contact-list">
          <li><span class="icon" data-icon="phone" aria-hidden="true"></span><a data-contact-phone></a></li>
          <li><span class="icon" data-icon="mail" aria-hidden="true"></span><a data-contact-email></a></li>
        </ul>
      </section>

      <section class="card contact-form-card">
        <h2>Napište mi</h2>
        <form class="contact-form" data-contact-form>
          <label>
            Vaše jméno
            <input type="text" name="your-name" required />
          </label>
          <label>
            Váš e-mail
            <input type="email" name="your-email" required />
          </label>
          <label>
            Předmět
            <input type="text" name="your-subject" required />
          </label>
          <label>
            Vaše zpráva (volitelné)
            <textarea name="your-message" rows="5"></textarea>
          </label>
          <button type="submit" class="btn">Odeslat</button>
        </form>
        <!-- TODO: až se bude nasazovat do WordPressu, napojit na Contact Form 7
             (plugin je na produkci už aktivní), aby zprávy chodily klientce
             na e-mail. Pole výše (your-name/your-email/your-subject/
             your-message) odpovídají názvům polí reálného formuláře na
             justyoga.cz/kontakt/, takže při nasazení stačí formulář nahradit
             CF7 shortcodem beze změny obsahu/pojmenování polí. Do té doby
             odeslání nikam nevede — viz preventDefault v kontakt.js. -->
      </section>
    </div>
  </main>

  <site-footer></site-footer>
</body>
</html>
