<!DOCTYPE html>
<html lang="cs">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Kontakt – Just Yoga Boskovice</title>
    <meta
      name="description"
      content="Kontakt na Lenku Nahodilovou a obě místa, kde Just Yoga Boskovice cvičí: jógové studio na Bílkově a posilovna u ZŠ Slovákova."
    />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Just Yoga a pohybové studio Boskovice" />
    <meta property="og:title" content="Kontakt – Just Yoga Boskovice" />
    <meta
      property="og:description"
      content="Telefon, e-mail a obě adresy, kde se cvičí."
    />
    <meta property="og:image" content="https://justyoga.cz/assets/images/og-default.png" />
    <meta property="og:locale" content="cs_CZ" />

    <link rel="icon" href="assets/images/favicon-32.png" sizes="32x32" />
    <link rel="apple-touch-icon" href="assets/images/apple-touch-icon.png" />

    <link
      rel="preload"
      href="assets/fonts/fraunces-latin-400-italic.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

    <link rel="stylesheet" href="css/fonts.css" />
    <link rel="stylesheet" href="css/tokens.css" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/layout.css" />

    <script type="module" src="js/pages/kontakt.js"></script>
    <script type="module" src="js/seo.js"></script>
  </head>

  <body>
    <a class="skip-link" href="#main">Přeskočit na obsah</a>

    <div data-site-header></div>

    <main id="main" tabindex="-1">
      <section class="page-hero">
        <div class="shell">
          <span class="eyebrow">Kontakt</span>
          <h1 class="page-hero__title">
            <span class="hero__title-main">Napište mi,</span>
            <span class="hero__title-accent">ozvu se</span>
          </h1>
          <p class="lede">
            Nejste si jistí, která lekce je pro vás? Napište mi nebo zavolejte,
            probereme to.
          </p>
        </div>
      </section>

      <section class="section" aria-labelledby="contact-title">
        <div class="shell">
          <div class="contact">
            <div class="contact__direct">
              <h2 id="contact-title">Lenka Nahodilová</h2>
              <hr class="rule" />
              <ul class="contact__list">
                <li>
                  <span class="contact__icon" data-icon="phone" aria-hidden="true"></span>
                  <a data-contact-phone></a>
                </li>
                <li>
                  <span class="contact__icon" data-icon="mail" aria-hidden="true"></span>
                  <a data-contact-email></a>
                </li>
              </ul>
            </div>

            <div class="card contact__form-card">
              <h2>Formulář</h2>
              <form class="contact__form" data-contact-form>
                <label>
                  <span>Vaše jméno</span>
                  <input type="text" name="your-name" autocomplete="name" required />
                </label>
                <label>
                  <span>Váš e-mail</span>
                  <input type="email" name="your-email" autocomplete="email" required />
                </label>
                <label>
                  <span>Čeho se dotaz týká</span>
                  <input type="text" name="your-subject" required />
                </label>
                <label>
                  <span>Zpráva (volitelné)</span>
                  <textarea name="your-message" rows="5"></textarea>
                </label>
                <button type="submit" class="btn btn--primary btn--block">Odeslat</button>
                <p class="contact__status" data-form-status role="status"></p>
              </form>
              <!-- TODO: při nasazení do WordPressu nahradit shortcodem Contact
                   Form 7 (plugin je na produkci aktivní). Názvy polí
                   (your-name / your-email / your-subject / your-message)
                   odpovídají reálnému formuláři na justyoga.cz/kontakt/,
                   takže se mění jen obal, ne obsah. Do té doby odeslání
                   nikam nevede — viz js/pages/kontakt.js. -->
            </div>
          </div>
        </div>
      </section>

      <section class="section band--alt" aria-labelledby="venues-title">
        <div class="shell">
          <header class="section__head" data-reveal>
            <span class="eyebrow">Kde cvičíme</span>
            <h2 id="venues-title">Dvě adresy, ne jedna</h2>
            <hr class="rule" />
            <p class="lede">
              Jóga je v jógovém studiu na Bílkově. Jumping a kondiční lekce jsou
              v posilovně u ZŠ Slovákova.
            </p>
          </header>

          <div data-venues></div>
        </div>
      </section>
    </main>

    <div data-site-footer></div>
  </body>
</html>
