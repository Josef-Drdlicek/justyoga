<!DOCTYPE html>
<html lang="cs">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Rozvrh a ceník – Just Yoga Boskovice</title>
    <meta
      name="description"
      content="Rozvrh a ceník lekcí jógy, jumpingu, tabaty, HIITu a kruhového tréninku v Boskovicích. Lekce od 150 Kč, permanentka platí 6 měsíců."
    />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Just Yoga a pohybové studio Boskovice" />
    <meta property="og:title" content="Rozvrh a ceník lekcí – Just Yoga Boskovice" />
    <meta
      property="og:description"
      content="Kdy a za kolik: jóga, jumping, tabata, HIIT a kruhový trénink v Boskovicích."
    />
    <meta property="og:image" content="https://justyoga.cz/assets/images/og-default.png" />
    <meta property="og:locale" content="cs_CZ" />
    <!-- canonical a og:url schválně chybí — viz checklist nasazení v CLAUDE.md. -->

    <link rel="icon" href="assets/images/favicon-32.png" sizes="32x32" />
    <link rel="apple-touch-icon" href="assets/images/apple-touch-icon.png" />

    <link
      rel="preload"
      href="assets/fonts/fraunces-latin-400-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

    <link rel="stylesheet" href="css/fonts.css" />
    <link rel="stylesheet" href="css/tokens.css" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/layout.css" />

    <script type="module" src="js/pages/rozvrh-cenik.js"></script>
    <script type="module" src="js/seo.js"></script>
  </head>

  <body>
    <a class="skip-link" href="#main">Přeskočit na obsah</a>

    <div data-site-header></div>

    <main id="main" tabindex="-1">
      <section class="page-hero">
        <div class="shell">
          <span class="eyebrow">Rozvrh a ceník</span>
          <h1 class="page-hero__title">
            <span class="hero__title-main">Kdy se cvičí</span>
            <span class="hero__title-accent">a za kolik</span>
          </h1>
          <p class="lede">
            Stálý týdenní rozvrh. Permanentka platí 6 měsíců od zakoupení
            a vyjde levněji než jednotlivé vstupy.
          </p>
        </div>
      </section>

      <section class="section band--alt" id="rozvrh" aria-labelledby="schedule-title">
        <div class="shell">
          <header class="section__head" data-reveal>
            <h2 id="schedule-title">Rozvrh</h2>
            <hr class="rule" />
          </header>

          <div data-week-legend></div>
          <div data-week></div>
        </div>
      </section>

      <section class="section" id="rezervace" aria-labelledby="booking-title">
        <div class="shell">
          <header class="section__head" data-reveal>
            <h2 id="booking-title">Rezervace</h2>
            <hr class="rule" />
            <p class="lede">
              Rezervace neběží na tomto webu — každá aktivita má svůj vlastní
              systém.
            </p>
          </header>

          <div data-booking></div>
        </div>
      </section>

      <section class="section band--alt" id="cenik" aria-labelledby="pricing-title">
        <div class="shell">
          <header class="section__head" data-reveal>
            <h2 id="pricing-title">Ceník</h2>
            <hr class="rule" />
          </header>

          <div data-pricing></div>
        </div>
      </section>

      <section class="section" aria-labelledby="faq-title">
        <div class="shell">
          <header class="section__head" data-reveal>
            <h2 id="faq-title">Časté otázky</h2>
            <hr class="rule" />
          </header>

          <div data-faq></div>
        </div>
      </section>
    </main>

    <div data-site-footer></div>

    <!-- ⚠️ MUSÍ zůstat přímým potomkem <body>: position: fixed se zasekne
         uvnitř předka s transform, filter nebo contain. -->
    <div data-heart-rate-meter></div>
  </body>
</html>
