<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Rozvrh a ceník – Just Yoga Boskovice</title>
  <meta name="description" content="Rozvrh a ceník lekcí jógy, jumpingu, tabaty, HIITu a kruhového tréninku v Boskovicích. Od 150 Kč za lekci, permanentka platí 6 měsíců." />
  <meta property="og:site_name" content="Just Yoga a pohybové studio Boskovice" />
  <!-- Náhled při sdílení. Klientka je aktivní na Facebooku i Instagramu
       a odkaz na web tam dosud vypadal jako holý text bez obrázku.
       og:image MUSÍ být absolutní URL — relativní Facebook ignoruje.
       ⚠️ PŘI NASAZENÍ: doména i cesta se změní (jako motiv skončí obrázek
       ve wp-content/themes/…, nebo se nahraje do Media Library).
       ⚠️ canonical a og:url tady schválně NEJSOU: finální slugy ve
       WordPressu nejsou známé (živý web má /rozvrh a /ceník zvlášť)
       a špatný canonical dokáže stránku vyřadit z indexu. Doplnit při
       nasazení spolu s 301 přesměrováním ze starých adres. -->
  <meta property="og:type" content="website" />
  <meta property="og:locale" content="cs_CZ" />
  <meta property="og:title" content="Rozvrh a ceník lekcí – Just Yoga Boskovice" />
  <meta property="og:description" content="Kdy a za kolik: jóga, jumping, tabata, HIIT a kruhový trénink v Boskovicích. Lekce od 150 Kč, permanentka na 10 vstupů platí 6 měsíců." />
  <meta property="og:image" content="https://justyoga.cz/assets/images/og-default.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="Lenka Nahodilová v jógové pozici, logo Just Yoga Boskovice a tři tepové zóny" />
  <meta name="twitter:card" content="summary_large_image" />
  <link rel="icon" href="assets/images/favicon-32.png" sizes="32x32" type="image/png" />
  <link rel="icon" href="assets/images/favicon-512.png" sizes="512x512" type="image/png" />
  <link rel="apple-touch-icon" href="assets/images/apple-touch-icon.png" />
  <!-- Raleway 300 nese H1, tedy LCP text stránky. Bez preloadu ho prohlížeč
       objeví až po vyhodnocení CSS (měřeno: start ~49 ms). Dva soubory, ne
       jeden: české nadpisy potřebují latin i latin-ext subset. crossorigin
       je povinné i pro same-origin fonty — bez něj se preload zahodí
       a soubor se stáhne dvakrát. -->
  <link rel="preload" href="assets/fonts/raleway-latin-300-normal.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="assets/fonts/raleway-latin-ext-300-normal.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="css/fonts.css" />
  <link rel="stylesheet" href="css/tokens.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <script type="module" src="js/main.js"></script>
  <script type="module" src="js/seo.js"></script>
  <script type="module" src="js/pages/rozvrh-cenik.js"></script>
</head>
<body>
  <site-header></site-header>

  <main id="main" tabindex="-1" class="page-shell section">
    <h1 class="page-heading">Rozvrh a ceník</h1>
    <p class="lede">
      Otevřené lekce pro všechny, permanentka platí 6 měsíců. Vyberte si lekci
      a rezervujte termín přímo u příslušné aktivity.
    </p>

    <div class="section-stack">
      <!-- Cíl odkazu "Zobrazit termíny" z ceníkových karet. Id musí být
           tady, ve light DOM — id uvnitř Shadow DOM není přes URL fragment
           dosažitelné. -->
      <section id="rozvrh" class="anchor-target">
        <h2 class="section-heading">Rozvrh</h2>
        <schedule-widget data-schedule-widget></schedule-widget>
        <p class="section-note">Kapacita lekcí je omezená – rezervujte si místo včas.</p>
      </section>
      <section id="cenik" class="anchor-target">
        <h2 class="section-heading">Ceník</h2>
        <pricing-cards data-pricing-cards></pricing-cards>
      </section>
    </div>
  </main>

  <site-footer></site-footer>
</body>
</html>
