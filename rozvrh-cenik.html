<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Rozvrh a ceník – Just Yoga Boskovice</title>
  <meta name="description" content="Týdenní rozvrh a ceník lekcí jógy se světelnou terapií, jumpingu, tabaty, HIITu a kruhového tréninku v Boskovicích." />
  <meta property="og:site_name" content="Just Yoga a pohybové studio Boskovice" />
  <link rel="icon" href="assets/images/favicon-32.png" sizes="32x32" type="image/png" />
  <link rel="icon" href="assets/images/favicon-512.png" sizes="512x512" type="image/png" />
  <link rel="apple-touch-icon" href="assets/images/apple-touch-icon.png" />
  <!-- Raleway 300 nese H1, tedy LCP text stránky. Bez preloadu ho prohlížeč
       objeví až po vyhodnocení CSS (měřeno: start ~49 ms). Dva soubory, ne
       jeden: české nadpisy potřebují latin i latin-ext subset. crossorigin
       je povinné i pro same-origin fonty — bez něj se preload zahodí
       a soubor se stáhne dvakrát. -->
  <link rel="preload" href="assets/fonts/raleway-latin-300-normal.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="assets/fonts/raleway-latin-ext-300-normal.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="css/fonts.css" />
  <link rel="stylesheet" href="css/tokens.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <script type="module" src="js/main.js"></script>
  <script type="module" src="js/seo.js"></script>
  <script type="module" src="js/pages/rozvrh-cenik.js"></script>
</head>
<body>
  <site-header></site-header>

  <main id="main" tabindex="-1" class="page-shell section">
    <h1 class="page-heading">Rozvrh a ceník</h1>
    <p class="lede">
      Otevřené lekce pro všechny, permanentka platí 6 měsíců. Vyberte si lekci
      a rezervujte termín přímo u příslušné aktivity.
    </p>

    <div class="section-stack">
      <!-- Cíl odkazu "Zobrazit termíny" z ceníkových karet. Id musí být
           tady, ve light DOM — id uvnitř Shadow DOM není přes URL fragment
           dosažitelné. -->
      <section id="rozvrh" class="anchor-target">
        <h2 class="section-heading">Rozvrh</h2>
        <schedule-widget data-schedule-widget></schedule-widget>
        <p class="section-note">Kapacita lekcí je omezená – rezervujte si místo včas.</p>
      </section>
      <section id="cenik" class="anchor-target">
        <h2 class="section-heading">Ceník</h2>
        <pricing-cards data-pricing-cards></pricing-cards>
      </section>
    </div>
  </main>

  <site-footer></site-footer>
</body>
</html>
